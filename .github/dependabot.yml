version: 2

updates:
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'

  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'monthly'
    cooldown:
      default-days: 7
    commit-message:
      prefix: 'build'
    ignore:
      # @astrojs/check supports TypeScript ^5 || ^6 only. Remove this rule
      # once it supports TypeScript 7.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
    groups:
      npm:
        patterns:
          - '*'
